name: OrbiTouch ATS — Continuous Integration

on:
  push:
    branches: [ main, "feat/**", "fix/**", "perf/**" ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    name: Build, Static Analysis & Test Suite
    runs-on: ubuntu-latest

    env:
      APP_NAME: "OrbiTouch ATS"
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Kolkata
      APP_CURRENCY: INR
      DB_CONNECTION: sqlite
      DB_DATABASE: database/testing.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, gd, zip, fileinfo
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Security dependency audit (Composer)
        run: composer audit --no-interaction

      - name: Install Frontend dependencies
        run: npm ci

      - name: Compile Frontend assets
        run: npm run build

      - name: Validate PHP syntax across application
        run: find app config database routes tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check code formatting with Laravel Pint
        run: ./vendor/bin/pint --test

      - name: Prepare isolated test database
        run: |
          cp .env.example .env
          touch database/testing.sqlite
          php artisan key:generate

      - name: Execute database migration & rollback verification
        run: |
          php artisan migrate:fresh --env=testing --force
          php artisan migrate:refresh --env=testing --force

      - name: Run Unit, Feature & Recruitment Lifecycle Tests
        run: php artisan test --env=testing
